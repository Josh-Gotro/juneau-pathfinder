<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the app paint into the notch and home-indicator
       areas; the shell pads itself back out with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Match the app ground so the status bar doesn't band against it.
       Both are declared; the browser picks by the active colour scheme. -->
  <meta name="theme-color" content="#f5f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />

  <link rel="apple-touch-icon" href="/xtratuf_192.png" />
  <link rel="icon" type="image/png" href="/xtratuf_192.png" />

  <title>Juneau Pathfinder</title>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
